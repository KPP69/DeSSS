[package]
name = "desss"
version = "0.1.0"
edition = "2021"
[lib]
name = "desss_lib"
crate-type = ["staticlib","cdylib","rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4","serde"] }
rand = "0.8"
thiserror = "2"
aes-gcm = "0.10"
# Phase 3: read-only exchange adapters (pure Rust TLS, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
webpki-roots = "0.26"
# AsterDEX V1 signed REST: HMAC-SHA256 over the query string (pure Rust).
hmac = "0.12"
sha2 = "0.10"
# AsterDEX V3 Agent wallets: EIP-712 signing (pure Rust, no OpenSSL).
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
# Phase 5A §3: strict order precision (pure Rust, no C deps). Decimal
# stays internal to alignment / risk math; f64 at every API boundary,
# so no serde feature is needed. The `macros` feature only adds the
# `dec!` literal macro used in tests (a pure-Rust proc-macro crate).
rust_decimal = { version = "1", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Test-only: generate a self-signed cert for the local mock CONNECT +
# TLS WebSocket integration test (net/ws.rs).
[dev-dependencies]
rcgen = "0.13"
